<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Форма роста</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--card:#111111;--ink:#F2F2F2;--mut:#8C8C8C;--line:#242424;--ind:#FF6A00;--volt:#FF6A00;--volt-ink:#0A0A0A;--red:#FF4D4D;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Onest,system-ui,sans-serif;font-weight:600;line-height:1.2;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(1.6rem,5vw,2.4rem)}h2{font-size:1.1rem;margin-bottom:14px}h3{font-size:1rem}
a{color:var(--volt)}
:focus-visible{outline:2px solid var(--volt);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.logo{font-family:Unbounded,sans-serif;font-weight:500;margin-right:auto;font-size:1rem;letter-spacing:.02em}
.logo i{display:inline-block;width:10px;height:10px;background:var(--volt);border-radius:50%;margin-right:10px}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block;min-height:40px;transition:border-color .15s,color .15s,background .15s}
button:hover,.btn:hover{border-color:var(--volt);color:var(--volt);background:transparent}
.pri{background:var(--volt);color:var(--volt-ink);border-color:var(--volt)}
.pri:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dng{border-color:var(--line);color:var(--red)}
.dng:hover{background:transparent;border-color:var(--red);color:var(--red)}
.on,.on:hover{background:var(--volt);color:var(--volt-ink);border-color:var(--volt)}
.sm{padding:4px 10px;min-height:32px;font-size:.9rem}
input,select{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 2px;min-height:40px;width:100%}
input:focus,select:focus{outline:none;border-bottom-color:var(--volt)}
select option{background:#111;color:#F2F2F2}
input[type="date"]{color-scheme:dark}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.hero{background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:28px 0 32px;display:grid;gap:18px}
.hero h1{color:var(--mut);font-weight:500;font-size:1.1rem}
.big{font-family:Unbounded,sans-serif;font-weight:500;color:var(--volt);font-size:clamp(3.5rem,16vw,7rem);line-height:1}
.big span{color:var(--mut)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--volt)}
.stats{display:flex;gap:32px;flex-wrap:wrap;color:var(--mut)}
.stats div b{font-family:Onest,sans-serif;font-weight:600;font-size:1.5rem;color:var(--ink);display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:.8rem;border:1px solid var(--line);border-radius:4px;padding:1px 8px;color:var(--mut)}
.mut{color:var(--mut)}
.rank{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.rank.me{background:transparent;color:var(--volt);font-weight:600}
.rank span:nth-child(2){flex:1}
.ach{display:flex;gap:12px;align-items:center;padding:8px 0}
.ach i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.8rem;background:transparent;border:1px solid var(--line);color:var(--mut);flex:none}
.ach.ok i{background:var(--volt);color:var(--volt-ink);border-color:var(--volt);font-weight:600}
.ach:not(.ok){opacity:.5}
.ex{display:grid;grid-template-columns:1fr repeat(4,minmax(0,78px)) auto;gap:8px;align-items:end;padding:14px 0;border-top:1px solid var(--line)}
.ex label{margin:0;font-size:.75rem}.ex input{padding:6px 2px;min-height:36px}
@media(max-width:700px){.ex{grid-template-columns:repeat(4,1fr)}.ex>div:first-child{grid-column:1/-1}.ex>button{grid-column:1/-1}}
details{margin:8px 0}summary{cursor:pointer;font-weight:500;color:var(--volt)}
.err{color:var(--red);font-weight:500}
.auth{max-width:400px;margin:8vh auto}
.chart{width:100%;height:auto;max-height:200px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}
    #gd-btn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;border-radius:999px;background:var(--volt);color:var(--volt-ink);border-color:var(--volt);padding:10px 20px}
#gd-btn:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#gd{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:20;width:min(360px,calc(100vw - 32px));max-height:70vh;display:none;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#gd.open{display:flex}
#gd header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
#gd-log{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.gd-m{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.95rem}
.gd-u{align-self:flex-end;background:var(--volt);color:var(--volt-ink);border-color:var(--volt)}
#gd-q{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 14px;border-top:1px solid var(--line);max-height:34vh;overflow:auto}
</style>
</head>
<body>
<div id="app"></div>
<script>
const mem={};
const load=(k,d)=>{if(k in mem)return mem[k];try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const save=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yt=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q+' техника выполнения');
const EX=[
['Приседания со штангой','Ноги','Базовое упражнение для квадрицепсов и ягодиц.','Штанга на трапециях, стопы на ширине плеч. Опуститесь до параллели бёдер с полом, спина прямая, и вставайте на выдохе.'],
['Приседания с собственным весом','Ноги','Лёгкий вариант для разминки и дома.','Руки перед собой, колени смотрят туда же, куда носки. Опускайтесь медленно, пятки не отрывайте.'],
['Выпады','Ноги','Работа ног и баланса.','Шагните вперёд, опустите заднее колено к полу, оттолкнитесь передней ногой и вернитесь.'],
['Жим лёжа','Грудь','Главное упражнение на грудные мышцы.','Лопатки сведены, штанга опускается к середине груди, жмите вверх без отрыва таза от скамьи.'],
['Отжимания','Грудь','Грудь, плечи и трицепс без оборудования.','Тело прямое от головы до пяток, локти под углом 45°, опуститесь до касания грудью пола.'],
['Разводка гантелей','Грудь','Изолированная нагрузка на грудь.','Лёжа, руки слегка согнуты. Разводите гантели дугой и сводите над грудью.'],
['Становая тяга','Спина','Тяжёлая база для спины и ног.','Штанга у голеней, спина ровная. Тяните, разгибая ноги и таз одновременно.'],
['Подтягивания','Спина','Ширина спины и сила рук.','Хват чуть шире плеч, тянитесь грудью к перекладине, опускайтесь полностью.'],
['Тяга гантели в наклоне','Спина','Толщина спины, каждая сторона отдельно.','Упритесь рукой в скамью, тяните гантель к поясу, локоть вдоль тела.'],
['Жим гантелей сидя','Плечи','Развивает дельты.','Гантели у плеч, выжимайте вверх до почти прямых рук и опускайте под контролем.'],
['Махи в стороны','Плечи','Средняя дельта.','Лёгкие гантели, поднимайте руки до уровня плеч, локти чуть согнуты.'],
['Сгибания на бицепс','Руки','Классика для бицепса.','Локти прижаты к корпусу, поднимайте гантели без раскачки.'],
['Французский жим','Руки','Нагрузка на трицепс.','Лёжа, опускайте штангу к ушам, сгибая только локти.'],
['Планка','Пресс','Статичное упражнение для кора.','Опора на предплечья, тело прямое, живот напряжён. Фиксируйте время.'],
['Скручивания','Пресс','Прямая мышца живота.','Лёжа, ноги согнуты, поднимайте лопатки от пола, поясница прижата.'],
['Бег','Кардио','Выносливость и сердце.','Держите ровный темп, дышите свободно. Фиксируйте дистанцию и время.'],
['Скакалка','Кардио','Быстрое кардио в любом месте.','Прыгайте на носках, запястья крутят скакалку, колени мягкие.']
].map((e,i)=>({id:i,name:e[0],g:e[1],d:e[2],how:e[3]}));
const GROUPS=[...new Set(EX.map(e=>e.g))];
const SEED=[['Артём К.',640],['Лиза М.',520],['Игорь С.',410],['Даша Н.',290],['Макс В.',150]];
let S={tab:'w',open:null,target:null,q:'',g:'',mode:'in',err:'',rep:false};
const users=()=>load('fr_users',[]);
const me=()=>users().find(u=>u.email===load('fr_s',null));
const WK=()=>load('fr_w_'+me().email,[]);
const setWK=w=>save('fr_w_'+me().email,w);
const has=i=>(+i.reps||0)+(+i.weight||0)+(+i.time||0)+(+i.dist||0)>0;
const pts=w=>w.items.reduce((a,i)=>a+(has(i)?10+(+i.reps||0)+Math.floor((+i.time||0)/60)+Math.floor((+i.dist||0)/100):0),0);
const done=w=>w.items.some(has);
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>{try{return new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}catch(e){return d}};
const ex=id=>EX.find(e=>e.id==id);
function stats(){
  const w=WK(),dn=w.filter(done),total=w.reduce((a,x)=>a+pts(x),0);
  const items=dn.flatMap(x=>x.items.filter(has));
  const gr={};items.forEach(i=>{const g=ex(i.ex).g;gr[g]=(gr[g]||0)+1});
  const ach=[
    ['★','Первый шаг','Запишите результат первой тренировки',dn.length>=1],
    ['5','Пятёрка','Пять тренировок с результатами',dn.length>=5],
    ['100','Сотня','Наберите 100 очков',total>=100],
    ['4','Универсал','Упражнения на 4 группы мышц',Object.keys(gr).length>=4],
    ['кг','Железо','Подход с весом от 50 кг',items.some(i=>+i.weight>=50)]];
  return{w,dn,total,items,gr,ach,lvl:Math.floor(total/100)+1,rest:total%100,
    reps:items.reduce((a,i)=>a+(+i.reps||0),0),vol:items.reduce((a,i)=>a+(+i.reps||0)*(+i.weight||0),0),
    time:items.reduce((a,i)=>a+(+i.time||0),0),dist:items.reduce((a,i)=>a+(+i.dist||0),0)};
}
function authView(){
  const reg=S.mode==='up';
  return `<main class="auth wrap"><div class="logo" style="margin-bottom:18px"><i></i>Форма роста</div>
  <h1 style="margin-bottom:8px">${reg?'Создайте аккаунт':'Вход'}</h1>
  <p class="mut">Записывайте тренировки, копите очки и поднимайтесь в рейтинге.</p>
  <form class="card" onsubmit="return doAuth(event)" novalidate>
  ${reg?'<label for="n">Имя</label><input id="n" autocomplete="name">':''}
  <label for="e">Эл. почта</label><input id="e" type="email" autocomplete="email">
  <label for="p">Пароль (от 6 символов)</label><input id="p" type="password" autocomplete="${reg?'new-password':'current-password'}">
  <p class="err" role="alert">${esc(S.err)}</p>
  <div class="row"><button class="pri" type="submit">${reg?'Зарегистрироваться':'Войти'}</button>
  <button type="button" onclick="S.mode='${reg?'in':'up'}';S.err='';render()">${reg?'У меня есть аккаунт':'Нет аккаунта'}</button></div></form></main>`;
}
function doAuth(ev){
  ev.preventDefault();
  const e=$v('e').trim().toLowerCase(),p=$v('p'),n=S.mode==='up'?$v('n').trim():'';
  const us=users();
  if(!/^\S+@\S+\.\S+$/.test(e)){S.err='Введите корректную почту, например name@mail.ru';return render(),false}
  if(p.length<6){S.err='Пароль должен быть не короче 6 символов';return render(),false}
  if(S.mode==='up'){
    if(!n){S.err='Укажите имя';return render(),false}
    if(us.some(u=>u.email===e)){S.err='Такая почта уже зарегистрирована. Войдите';return render(),false}
    us.push({email:e,pass:p,name:n,age:'',weight:'',goal:''});save('fr_users',us);
  }else{
    const u=us.find(u=>u.email===e&&u.pass===p);
    if(!u){S.err='Неверная почта или пароль';return render(),false}
  }
  save('fr_s',e);S.err='';location.hash='#home';render();return false;
}
const $v=id=>document.getElementById(id).value;

function navView(){
  const h=location.hash;
  const l=(x,t)=>`<a class="btn ${h===x?'on':''}" href="${x}">${t}</a>`;
  return `<nav><div class="wrap"><span class="logo"><i></i>Форма роста</span>${l('#home','Главная')}${l('#cabinet','Кабинет')}<button onclick="logout()">Выйти</button></div></nav>`;
}
function logout(){save('fr_s',null);S.open=null;location.hash='#auth';render()}

function chart(dn){
  const d=dn.slice(-7).map(w=>({l:fmt(w.date),v:pts(w)}));
  if(!d.length)return '<p class="mut">Здесь появится график, когда вы запишете первую тренировку.</p>';
  const max=Math.max(...d.map(x=>x.v),1),bw=500/d.length;
  return `<svg class="chart" viewBox="0 0 500 190" role="img" aria-label="Очки за последние тренировки">${d.map((x,i)=>{
    const h=Math.max(4,x.v/max*140);
    return `<rect x="${i*bw+bw*.15}" y="${150-h}" width="${bw*.7}" height="${h}" rx="6" fill="var(--ind)"/><text x="${i*bw+bw/2}" y="${144-h}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">${x.v}</text><text x="${i*bw+bw/2}" y="172" text-anchor="middle" font-size="11" fill="var(--mut)">${esc(x.l)}</text>`}).join('')}</svg>`;
}
function homeView(){
  const u=me(),s=stats();
  const rating=[...SEED.map(x=>({n:x[0],p:x[1]})),{n:u.name,p:s.total,me:1}].sort((a,b)=>b.p-a.p);
  return `<main class="wrap"><section class="hero"><h1>${esc(u.name)}, ваш уровень ${s.lvl}</h1>
  <div class="big">${s.total}<span style="font-size:.28em"> очков</span></div>
  <div><div class="bar" role="progressbar" aria-valuenow="${s.rest}" aria-valuemin="0" aria-valuemax="100"><b style="width:${s.rest}%"></b></div><p style="margin:6px 0 0">До уровня ${s.lvl+1} осталось ${100-s.rest} очков</p></div>
  <div class="stats"><div><b>${s.dn.length}</b>тренировок</div><div><b>${s.items.length}</b>упражнений</div><div><b>${s.reps}</b>повторений</div></div>
  <div><a class="btn" href="#cabinet" onclick="S.tab='w'">Начать тренировку</a></div></section>
  <div class="grid g2" style="margin-top:16px">
  <section class="card"><h2>Динамика прогресса</h2>${chart(s.dn)}</section>
  <section class="card"><h2>Рейтинг пользователей</h2>${rating.map((r,i)=>`<div class="rank ${r.me?'me':''}"><span>${i+1}</span><span>${esc(r.n)}${r.me?' (вы)':''}</span><span>${r.p}</span></div>`).join('')}</section>
  <section class="card"><h2>Достижения</h2>${s.ach.map(a=>`<div class="ach ${a[3]?'ok':''}"><i>${a[0]}</i><div><b>${a[1]}</b><br><span class="mut">${a[2]}</span></div></div>`).join('')}</section>
  <section class="card"><h2>Последние тренировки</h2>${s.dn.slice(-3).reverse().map(w=>`<p><b>${esc(w.name)}</b> <span class="mut">${fmt(w.date)}</span> +${pts(w)} очков</p>`).join('')||'<p class="mut">Пока пусто. Создайте тренировку в кабинете.</p>'}</section>
  </div></main>`;
}
function cabView(){
  const tabs=[['w','Тренировки'],['e','Упражнения'],['h','История'],['p','Профиль']];
  const body={w:workoutsView,e:exView,h:histView,p:profView}[S.tab]();
  return `<main class="wrap"><h1>Личный кабинет</h1><div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" aria-selected="${S.tab===t[0]}" class="${S.tab===t[0]?'on':''}" onclick="S.tab='${t[0]}';${t[0]!=='w'?'':'S.open=null;'}render()">${t[1]}</button>`).join('')}</div>${body}</main>`;
}
function workoutsView(){
  const w=WK();
  if(S.open){
    const x=w.find(a=>a.id===S.open);
    if(!x){S.open=null;return workoutsView()}
    return `<section class="card"><div class="row"><button class="sm" onclick="S.open=null;render()">← К списку</button><span class="mut">Очки: <b id="pts">${pts(x)}</b></span></div>
    <div class="grid g2"><div><label for="wn">Название</label><input id="wn" value="${esc(x.name)}" onchange="upd(${x.id},'name',this.value)"></div>
    <div><label for="wd">Дата</label><input id="wd" type="date" value="${esc(x.date)}" onchange="upd(${x.id},'date',this.value)"></div></div>
    <h2 style="margin-top:18px">Упражнения</h2>
    ${x.items.map((i,k)=>`<div class="ex"><div><b>${esc(ex(i.ex).name)}</b><br><span class="tag">${ex(i.ex).g}</span></div>
      ${[['reps','Повторы'],['weight','Вес, кг'],['time','Время, с'],['dist','Дист., м']].map(f=>`<div><label for="f${k}${f[0]}">${f[1]}</label><input id="f${k}${f[0]}" type="number" min="0" inputmode="decimal" value="${esc(i[f[0]]??'')}" onchange="setRes(${x.id},${k},'${f[0]}',this.value)"></div>`).join('')}
      <button class="sm dng" onclick="rmEx(${x.id},${k})" aria-label="Удалить упражнение">Удалить</button></div>`).join('')||'<p class="mut">В тренировке пока нет упражнений.</p>'}
    <div class="row" style="margin-top:14px"><button class="pri" onclick="S.target=${x.id};S.tab='e';render()">Добавить упражнение</button>
    <button class="dng" onclick="delW(${x.id})">Удалить тренировку</button></div></section>`;
  }
  return `<section class="card"><h2>Новая тренировка</h2><div class="row"><div style="flex:2;min-width:180px"><label for="nn">Название</label><input id="nn" placeholder="Например, Ноги и пресс"></div>
  <div style="flex:1;min-width:150px"><label for="nd">Дата</label><input id="nd" type="date" value="${today()}"></div><button class="pri" style="align-self:end" onclick="addW()">Создать</button></div></section>
  <div class="grid g3" style="margin-top:16px">${w.slice().reverse().map(x=>`<div class="card"><h3>${esc(x.name)}</h3><p class="mut">${fmt(x.date)}, упражнений: ${x.items.length}, очков: ${pts(x)}</p>
  <div class="row"><button class="sm pri" onclick="S.open=${x.id};render()">Открыть</button><button class="sm dng" onclick="delW(${x.id})">Удалить</button></div></div>`).join('')||'<p class="mut">Тренировок нет. Создайте первую выше.</p>'}</div>`;
}
function addW(){
  const n=$v('nn').trim()||'Тренировка',d=$v('nd')||today(),w=WK();
  const id=Date.now();w.push({id,name:n,date:d,items:[]});setWK(w);S.open=id;render();
}
function upd(id,f,v){const w=WK();const x=w.find(a=>a.id===id);x[f]=f==='name'?(v.trim()||'Тренировка'):v;setWK(w)}
function delW(id){if(!confirm('Удалить тренировку? Это действие нельзя отменить.'))return;setWK(WK().filter(a=>a.id!==id));S.open=null;render()}
function setRes(id,k,f,v){const w=WK();const x=w.find(a=>a.id===id);x.items[k][f]=v===''?'':Math.max(0,+v);setWK(w);const e=document.getElementById('pts');if(e)e.textContent=pts(x)}
function rmEx(id,k){const w=WK();w.find(a=>a.id===id).items.splice(k,1);setWK(w);render()}

function exView(){
  const w=WK(),tg=w.find(a=>a.id===S.target);
  return `<section class="card"><h2>Поиск упражнений</h2>
  ${tg?`<p class="tag" style="display:inline-block">Добавляем в «${esc(tg.name)}»</p>`:''}
  <div class="grid g2"><div><label for="q">Название</label><input id="q" type="search" value="${esc(S.q)}" oninput="S.q=this.value;exList()" placeholder="Например, жим"></div>
  <div><label for="g">Группа мышц</label><select id="g" onchange="S.g=this.value;exList()"><option value="">Все группы</option>${GROUPS.map(g=>`<option ${S.g===g?'selected':''}>${g}</option>`).join('')}</select></div></div></section>
  <div id="exl" class="grid g3" style="margin-top:16px">${exCards()}</div>`;
}
function exList(){document.getElementById('exl').innerHTML=exCards()}
function exCards(){
  const w=WK(),q=S.q.trim().toLowerCase();
  const l=EX.filter(e=>(!S.g||e.g===S.g)&&(!q||e.name.toLowerCase().includes(q)));
  if(!l.length)return '<p class="mut">Ничего не найдено. Измените запрос или выберите другую группу мышц.</p>';
  return l.map(e=>`<article class="card"><span class="tag">${e.g}</span><h3 style="margin:8px 0">${e.name}</h3><p class="mut" style="margin:0">${e.d}</p>
  <details><summary>Инструкция</summary><p>${e.how}</p></details>
  <p><a href="${yt(e.name)}" target="_blank" rel="noopener noreferrer">Смотреть видео на YouTube</a></p>
  ${w.length?`<div class="row"><select id="s${e.id}" aria-label="Тренировка">${w.slice().reverse().map(x=>`<option value="${x.id}" ${x.id===S.target?'selected':''}>${esc(x.name)}, ${fmt(x.date)}</option>`).join('')}</select><button class="sm pri" onclick="addEx(${e.id})">Добавить в тренировку</button></div>`:'<p class="mut">Сначала создайте тренировку на вкладке «Тренировки».</p>'}</article>`).join('');
}
function addEx(id){
  const wid=+$v('s'+id),w=WK(),x=w.find(a=>a.id===wid);
  x.items.push({ex:id,reps:'',weight:'',time:'',dist:''});setWK(w);S.open=wid;S.target=null;S.tab='w';render();
}
function histView(){
  const s=stats(),top=Object.entries(s.gr).sort((a,b)=>b[1]-a[1]);
  return `<section class="card"><div class="row"><h2 style="margin:0;flex:1">История тренировок</h2><button onclick="S.rep=!S.rep;render()">${S.rep?'Скрыть отчёт':'Сформировать отчёт'}</button></div>
  ${S.rep?`<div class="card" style="margin-top:14px;background:var(--bg)"><h3>Отчёт о прогрессе</h3><div class="stats" style="margin:12px 0"><div><b>${s.dn.length}</b>тренировок</div><div><b>${s.total}</b>очков</div><div><b>${s.reps}</b>повторений</div><div><b>${s.vol}</b>кг общий тоннаж</div><div><b>${Math.round(s.time/60)}</b>мин под нагрузкой</div><div><b>${(s.dist/1000).toFixed(1)}</b>км</div></div>
  <p>${top.length?'Чаще всего вы тренировали: '+top.slice(0,3).map(t=>`${t[0]} (${t[1]})`).join(', ')+'.':'Данных пока нет.'}</p>${chart(s.dn)}</div>`:''}
  <div style="margin-top:12px">${s.dn.slice().reverse().map(w=>`<div style="padding:12px 0;border-top:1px solid var(--line)"><div class="row"><b>${esc(w.name)}</b><span class="mut">${fmt(w.date)}</span><span class="tag">+${pts(w)} очков</span></div>
  <ul style="margin:6px 0 0;padding-left:20px">${w.items.filter(has).map(i=>`<li>${esc(ex(i.ex).name)}: ${[i.reps&&i.reps+' повт.',i.weight&&i.weight+' кг',i.time&&i.time+' с',i.dist&&i.dist+' м'].filter(Boolean).join(', ')}</li>`).join('')}</ul></div>`).join('')||'<p class="mut">История пуста. Запишите результаты в любой тренировке.</p>'}</div></section>`;
}
function profView(){
  const u=me();
  return `<section class="card" style="max-width:520px"><h2>Профиль</h2><p class="mut" style="margin:0">${esc(u.email)}</p>
  <label for="pn">Имя</label><input id="pn" value="${esc(u.name)}">
  <label for="pa">Возраст</label><input id="pa" type="number" min="5" max="100" value="${esc(u.age)}">
  <label for="pw">Вес, кг</label><input id="pw" type="number" min="20" max="300" value="${esc(u.weight)}">
  <label for="pg">Цель</label><input id="pg" value="${esc(u.goal)}" placeholder="Например, подтянуться 10 раз">
  <p id="ok" class="mut" role="status"></p><button class="pri" onclick="saveProf()">Сохранить изменения</button></section>`;
}
function saveProf(){
  const us=users(),u=us.find(x=>x.email===load('fr_s',null));
  u.name=$v('pn').trim()||u.name;u.age=$v('pa');u.weight=$v('pw');u.goal=$v('pg').trim();
  save('fr_users',us);document.getElementById('ok').textContent='Изменения сохранены';
}
function render(){
  const app=document.getElementById('app');
  if(!me()){if(location.hash!=='#auth')history.replaceState(null,'','#auth');app.innerHTML=authView();return}
  if(location.hash!=='#home'&&location.hash!=='#cabinet'){history.replaceState(null,'','#home')}
  app.innerHTML=navView()+(location.hash==='#cabinet'?cabView():homeView());
}
addEventListener('hashchange',render);
(function(){
const A={
'Как начать?':['1. Зарегистрируйтесь или войдите.','2. Откройте «Кабинет» и создайте тренировку.','3. На вкладке «Упражнения» добавьте упражнения в тренировку.','4. Впишите результаты и вернитесь на главную, чтобы увидеть очки.'],
'Как считаются очки?':'За упражнение с результатом даётся 10 очков, плюс 1 за каждое повторение, 1 за каждую минуту и 1 за каждые 100 м. Каждые 100 очков дают новый уровень.',
'Как добавить упражнение?':'Откройте «Кабинет», вкладку «Упражнения», найдите нужное по названию или группе мышц, выберите тренировку в списке и нажмите «Добавить в тренировку».',
'Как работает рейтинг?':'На главной ваши очки сравниваются с другими участниками. Чем больше очков, тем выше место в таблице.',
'Какие есть достижения?':['Первый шаг: первая тренировка с результатами.','Пятёрка: 5 тренировок.','Сотня: 100 очков.','Универсал: упражнения на 4 группы мышц.','Железо: вес от 50 кг.'],
'Как посмотреть прогресс?':'Откройте «Кабинет», вкладку «История» и нажмите «Сформировать отчёт». График динамики есть и на главной.'
};
const tip=()=>{
  if(!me())return 'Привет! Я гид по сайту. Зарегистрируйтесь, чтобы начать записывать тренировки.';
  if(location.hash==='#cabinet')return ({w:'Здесь вы создаёте тренировки. Откройте тренировку, чтобы добавить упражнения и записать результаты.',e:'Найдите упражнение по названию или группе мышц и добавьте его в тренировку.',h:'Здесь история занятий. Нажмите «Сформировать отчёт», чтобы увидеть сводку.',p:'Заполните профиль: возраст, вес и цель.'})[S.tab];
  return 'Это главная: очки, график, рейтинг и достижения. Запишите результаты тренировки, чтобы набрать очки.';
};
const recommend=()=>{
  if(!me())return 'Сначала войдите в аккаунт, и я подберу упражнения.';
  const s=stats();
  if(!s.items.length)return 'Для начала попробуйте: Отжимания, Приседания с собственным весом, Планка.';
  const g=GROUPS.map(x=>[x,s.gr[x]||0]).sort((a,b)=>a[1]-b[1])[0][0];
  return 'Меньше всего вы тренировали группу «'+g+'». Попробуйте: '+EX.filter(e=>e.g===g).slice(0,3).map(e=>e.name).join(', ')+'.';
};
const btn=document.createElement('button');
btn.id='gd-btn';btn.textContent='Гид';btn.setAttribute('aria-expanded','false');
const box=document.createElement('div');
box.id='gd';box.setAttribute('role','dialog');box.setAttribute('aria-label','Гид по сайту');
box.innerHTML=`<header><span>Гид по сайту</span><button class='sm' id='gd-x' aria-label='Закрыть'>✕</button></header><div id='gd-log'></div><div id='gd-q'></div>`;
document.body.append(btn,box);
const log=box.querySelector('#gd-log'),qs=box.querySelector('#gd-q');
const say=(t,u)=>{
  const d=document.createElement('div');d.className='gd-m'+(u?' gd-u':'');
  [].concat(t).forEach((s,i)=>{if(i)d.append(document.createElement('br'));d.append(s)});
  log.append(d);log.scrollTop=log.scrollHeight;
};
const chips={...A,'Что на этой странице?':tip,'Что потренировать?':recommend};
Object.keys(chips).forEach(k=>{
  const b=document.createElement('button');b.className='sm';b.textContent=k;
  b.onclick=()=>{say(k,1);const a=chips[k];say(typeof a==='function'?a():a)};
  qs.append(b);
});
const toggle=o=>{
  const open=o===undefined?!box.classList.contains('open'):o;
  box.classList.toggle('open',open);btn.setAttribute('aria-expanded',open);
  btn.textContent=open?'Закрыть':'Гид';
  if(open&&!log.children.length)say(tip());
};
btn.onclick=()=>toggle();
box.querySelector('#gd-x').onclick=()=>toggle(false);
addEventListener('keydown',e=>{if(e.key==='Escape')toggle(false)});
})();
render();
</script>
</body>
</html>
